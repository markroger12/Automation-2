# Builds the Windows installer of the desktop app (owner request: “open the .exe and the app opens; no cmd”).
# The installer is attached to the run as the artifact “Blog-Automation-Studio-Setup”. A build of main is also published
# as a GitHub release, which the installed app updates from (owner's go-ahead, 2026-11-12: “haan, release publish kro”).
name: Desktop app (Windows installer)

on:
  push:
    # Owner request (2026-11-12): the app is the main line now; the npm-only tool stays on claude/npm-version.
    branches: [main, claude/confident-brown-pwlrz6, claude/desktop-app]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5.0.0

      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 26.11.1
          cache: npm

      - name: Install the tool
        run: npm ci --no-audit --no-fund

      # With Next.js's standalone server (only the files it needs: a faster install; next.config.ts).
      - name: Build the dashboard
        env:
          BAS_STANDALONE: '1'
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Install Electron and electron-builder
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          # Electron itself (the check below runs the tool on it); does nothing when it is already there.
          node node_modules/electron/install.js

      # The app's own ChatGPT tab (owner request: the browser inside the app) on Windows: the real tab, its agent and the
      # extension's ChatGPT scripts against a fake ChatGPT page and the dashboard's agent handlers (no live ChatGPT).
      - name: Test the ChatGPT tab (Electron, fake ChatGPT page)
        run: |
          npx vitest run tests/unit/desktop-agent.test.ts tests/unit/desktop-google.test.ts tests/unit/desktop-updates.test.ts tests/unit/desktop-ux.test.ts tests/unit/desktop-bundle.test.ts
          npx vitest run --config vitest.integration.config.ts tests/integration/desktop-chatgpt.test.ts

      - name: Assemble the bundle (the tool and the packages it loads)
        run: node desktop/prepare.mjs

      # Runs a copy of the bundle outside the repository on the app's built-in Node.js, as the installed app does:
      # start-up steps on a new data folder, the dashboard and the worker (owner report: a package missing from the
      # bundle stopped the app).
      - name: Check the bundle outside the repository
        run: node desktop/check-bundle.mjs

      # Every build gets its own version (3.3.<run number>), so an installed app can tell a newer one.
      - name: Set the app version
        working-directory: desktop
        run: npm version "3.3.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build the installer
        working-directory: desktop
        run: npm run dist:win

      # The installer as the owner runs it: installed (silently here), then the app started once on a new data folder.
      - name: Install the app and start it once
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/dist/*.exe | Select-Object -First 1
          Write-Host "Installer: $($setup.Name), $([math]::Round($setup.Length / 1MB)) MB"
          $clock = [Diagnostics.Stopwatch]::StartNew()
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          Write-Host "Install time: $([math]::Round($clock.Elapsed.TotalSeconds)) s"
          Get-Process -Name 'Blog Automation Studio' -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Blog Automation Studio.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'The app was not installed.' }
          $files = Get-ChildItem $exe.DirectoryName -Recurse -File | Measure-Object -Property Length -Sum
          Write-Host "Installed: $($exe.DirectoryName), $([math]::Round($files.Sum / 1MB)) MB in $($files.Count) files"
          # As in C:\Program Files (owner report: EPERM there): the app may not create files or folders in its own
          # installation. Only those two rights are denied (WD, AD): the simple right W would also deny what starting
          # a program needs. icacls passes the inheritable entry on to everything inside.
          icacls $exe.DirectoryName /deny "$($env:USERNAME):(OI)(CI)(WD,AD)" /Q | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'icacls could not make the installation read-only.' }
          $env:BAS_DESKTOP_DATA_DIR = Join-Path $env:RUNNER_TEMP 'bas-smoke-data'
          $result = Join-Path $env:RUNNER_TEMP 'bas-smoke.json'
          $app = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test', "--smoke-result=$result" -PassThru
          if (-not $app.WaitForExit(300000)) { $app.Kill(); throw 'The app did not finish its first start in 5 minutes.' }
          $log = Join-Path $env:BAS_DESKTOP_DATA_DIR 'logs\desktop.log'
          if (Test-Path $log) { Get-Content $log -Tail 60 }
          if (-not (Test-Path $result)) { throw 'The app wrote no result.' }
          $r = Get-Content $result -Raw | ConvertFrom-Json
          Write-Host "Result: $($r.summary)"
          if (-not $r.ok) { exit 1 }

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: Blog-Automation-Studio-Setup
          path: desktop/dist/*.exe
          retention-days: 30
          if-no-files-found: error

      # What the installed app's updater reads: latest.yml (version, file name, checksum), the installer and its
      # blockmap (for smaller downloads). Checked on every build; for builds of main the publish job below puts them in a
      # release.
      - name: Check the update files
        shell: pwsh
        run: |
          $version = "3.3.${{ github.run_number }}"
          foreach ($name in @("Blog-Automation-Studio-Setup-$version.exe", "Blog-Automation-Studio-Setup-$version.exe.blockmap", 'latest.yml')) {
            if (-not (Test-Path "desktop/dist/$name")) { throw "Missing desktop/dist/$name" }
          }
          $latest = Get-Content desktop/dist/latest.yml -Raw
          Write-Host $latest
          if ($latest -notmatch "(?m)^version: $([regex]::Escape($version))\s*$") { throw "latest.yml does not name version $version" }
          if ($latest -notmatch "(?m)^path: Blog-Automation-Studio-Setup-$([regex]::Escape($version))\.exe\s*$") { throw 'latest.yml does not name the installer' }

      - uses: actions/upload-artifact@v4.6.2
        if: github.ref == 'refs/heads/main'
        with:
          name: Blog-Automation-Studio-Update
          path: |
            desktop/dist/Blog-Automation-Studio-Setup-*.exe
            desktop/dist/Blog-Automation-Studio-Setup-*.exe.blockmap
            desktop/dist/latest.yml
          retention-days: 7
          if-no-files-found: error

  # Each build of main becomes a GitHub release (v3.3.<run number>) with the installer, its blockmap and latest.yml;
  # the installed app finds it, downloads it and offers “Restart to update”. Only this job may write to the repository,
  # and it runs no code of the repository or of its packages: it only uploads the files the build above checked.
  publish:
    needs: windows
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: Blog-Automation-Studio-Update
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 3.3.${{ github.run_number }}
        run: |
          set -euo pipefail
          setup="release/Blog-Automation-Studio-Setup-$VERSION.exe"
          ls -la release
          test -f "$setup" && test -f "$setup.blockmap" && test -f release/latest.yml
          gh release create "v$VERSION" "$setup" "$setup.blockmap" release/latest.yml \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Blog Automation Studio $VERSION" \
            --notes "Desktop app $VERSION, built from ${GITHUB_SHA::7} on main. An installed app downloads it by itself and shows Restart to update; a new install: download Blog-Automation-Studio-Setup-$VERSION.exe below. Your data folder is never touched."
