# Builds the Windows installer of the desktop app (owner request: “open the .exe and the app opens; no cmd”).
# The installer is attached to the run as the artifact “Blog-Automation-Studio-Setup”.
name: Desktop app (Windows installer)

on:
  push:
    branches: [claude/desktop-app]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5.0.0

      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 26.11.1
          cache: npm

      - name: Install the tool
        run: npm ci --no-audit --no-fund

      - name: Build the dashboard
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Assemble the bundle (the tool and Node.js for Windows)
        run: node desktop/prepare.mjs

      # Runs a copy of the bundle outside the repository, as the installed app does: start-up steps on a new data
      # folder, the dashboard and the worker (owner report: a package missing from the bundle stopped the app).
      - name: Check the bundle outside the repository
        run: node desktop/check-bundle.mjs

      - name: Install Electron and electron-builder
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Build the installer
        working-directory: desktop
        run: npm run dist:win

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: Blog-Automation-Studio-Setup
          path: desktop/dist/*.exe
          retention-days: 30
          if-no-files-found: error
