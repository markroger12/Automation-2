<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Reconnecting</title>
    <style>
      /* Shown in the dashboard tab while the dashboard does not answer (main.cjs, guardDashboard): the tool's look. */
      :root { color-scheme: light; --bg: #f4f4f5; --surface: #fff; --border: #e4e4e7; --text: #09090b; --muted: #5f5f67; --primary: #18181b; --primary-fg: #fafafa; }
      html.dark { color-scheme: dark; --bg: #171717; --surface: #1f1f1f; --border: #323232; --text: #f5f5f5; --muted: #a6a6a6; --primary: #ececec; --primary-fg: #18181b; }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.5 'Segoe UI Variable', 'Segoe UI', Inter, system-ui, sans-serif; }
      .card { width: min(460px, 90vw); padding: 28px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); text-align: center; }
      .spin { width: 28px; height: 28px; margin: 0 auto 14px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
      h1 { margin: 0 0 6px; font-size: 17px; font-weight: 650; }
      p { margin: 0; color: var(--muted); font-size: 13px; }
      button { margin-top: 18px; height: 34px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--primary); color: var(--primary-fg); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="card" role="status" aria-live="polite">
      <div class="spin" aria-hidden="true"></div>
      <h1>Reconnecting to the dashboard…</h1>
      <p id="detail">The dashboard is starting again. Your work is safe; this page comes back by itself.</p>
      <button id="retry" type="button">Try now</button>
    </main>
    <script>
      const q = new URLSearchParams(location.search);
      if (q.get('theme') === 'dark') document.documentElement.classList.add('dark');
      // Only the local dashboard (main.cjs refuses any other address in this tab as well).
      const to = q.get('to') || '';
      const target = /^http:\/\/(localhost|127\.0\.0\.1):\d+\//.test(to) ? to : null;
      const go = () => target && location.replace(target);
      document.getElementById('retry').addEventListener('click', go);
      if (!target) document.getElementById('detail').textContent = 'Close the window and open the app again.';
      let left = 5;
      const timer = setInterval(() => {
        left -= 1;
        if (left > 0) return;
        clearInterval(timer);
        go();
      }, 1000);
    </script>
  </body>
</html>
